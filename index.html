<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセサリーマスター！ - KANDO BOARD!</title>
    <!-- Tailwind CSS & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .kando-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
        .kando-card-gold { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #f59e0b; }
        .kando-card-silver { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border: 2px solid #94a3b8; }
        .kando-card-bronze { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border: 2px solid #f97316; }
        .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Loading Indicator -->
    <div id="loading" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center space-y-4">
        <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-amber-300 font-bold text-sm tracking-widest animate-pulse">SSレイアウト完全最適化同期中...</p>
    </div>

    <!-- Header -->
    <header class="kando-bg border-b border-purple-900/50 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-pink-500 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg">
                    ✨
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-amber-200">
                        アクセサリーマスター！
                    </h1>
                    <p class="text-xs text-purple-300 font-bold tracking-wide">
                        〜SELECTIONマスターへの道⚔️〜
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <p class="text-xs text-slate-400">連携ステータス</p>
                    <p class="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> SS構造列マッピング適用済み
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 🔍 絞り込み ＆ 多項目ソートコントロール -->
        <section class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-xl backdrop-blur-md">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    <span>🔍</span> 実績データ検索 ＆ 多角分析ソート
                </h2>
                <span class="text-xs bg-purple-900/60 text-purple-300 px-2.5 py-1 rounded-full border border-purple-700/40" id="dataStatus">解析最適化済み</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">1. 所属エリア</label>
                    <select id="groupSelect" onchange="filterData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                        <option value="ALL">全エリア（全社）</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">2. 店舗名</label>
                    <select id="storeSelect" onchange="filterData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                        <option value="ALL">全店舗</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">3. クルー名</label>
                    <select id="crewSelect" onchange="updateCrewView()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                        <option value="ALL">全員</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">4. ランキングソート指標</label>
                    <select id="metricSelect" onchange="filterData()" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg px-3 py-2 text-sm text-amber-300 font-bold">
                        <option value="sales">💰 アクセサリ売上金額</option>
                        <option value="price">🏷️ アクセサリ単価</option>
                        <option value="targetRate" id="targetOptionLabel">🎯 店舗目標達成率 (%)</option>
                        <option value="diff">📊 全社平均比較 差分</option>
                        <option value="itemTotal">📦 総販売購入個数</option>
                    </select>
                </div>
            </div>

            <!-- 比較機能トグルバー -->
            <div class="mt-4 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs">
                <div class="flex items-center space-x-3">
                    <span class="text-slate-400 font-medium">🆚 比較モード:</span>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="compareToggle" checked onchange="toggleCompare()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                        <span class="ml-2 text-slate-200 font-semibold" id="compareLabel">G1位店舗 / 全社平均と比較表示中</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 🏆 ランキング TOP3（実データ連動） -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-extrabold text-white flex items-center gap-2">
                    <span>👑</span> 輝くスター（選択指標 ランキング TOP3）
                </h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="rankingContainer">
                <!-- 動的に生成されます -->
            </div>
        </section>

        <!-- 📊 レーダーチャート & 可視化比較グラフ -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- レーダーチャート（商材多角形分析） -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="text-base font-bold text-white">🎯 商材獲得多角分析（レーダー）</h3>
                        <span class="text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full" id="radarModeBadge">全社比較モード</span>
                    </div>
                    <p class="text-xs text-slate-400 mb-3" id="radarSub">選択対象: 全体</p>
                    <div class="relative w-full h-64">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
                <div class="mt-4 bg-purple-950/50 border border-purple-800/50 rounded-xl p-3 text-xs">
                    <p class="font-bold text-purple-300 mb-1">⚔️ SELECTION攻略アドバイス</p>
                    <p class="text-purple-100" id="aiAdvice">データ分析中...</p>
                </div>
            </div>

            <!-- 可視化比較棒グラフ（内訳可視化） -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="text-base font-bold text-white">📊 商材別獲得状況の可視化比較</h3>
                        <span class="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full" id="barChartBadge">可視化内訳</span>
                    </div>
                    <p class="text-xs text-slate-400 mb-3" id="barSub">商材カテゴリ別の詳細内訳</p>
                    <div class="relative w-full h-64">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs">
                    <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700"><p class="text-slate-400 text-[10px]">選択対象 総売上</p><p class="font-bold text-amber-300" id="totalSalesVal">￥0</p></div>
                    <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700"><p class="text-slate-400 text-[10px]">平均単価</p><p class="font-extrabold text-amber-400" id="avgPriceVal">￥0</p></div>
                    <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700"><p class="text-slate-400 text-[10px]" id="statMetaLabel">店舗目標達成率</p><p class="font-extrabold text-emerald-400" id="avgTargetVal">0%</p></div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const CSV_URLS = {
            target: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=0&single=true&output=csv",
            store: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=21976197&single=true&output=csv",
            qv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=1867085840&single=true&output=csv",
            personal: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=288066209&single=true&output=csv"
        };

        let rawPersonalData = [];
        let storeTargetMap = {};
        let storeTotalSalesMap = {};
        let radarChart, barChart;

        window.onload = function() {
            initCharts();
            loadAllCSVData();
        };

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
        }

        async function loadAllCSVData() {
            try {
                const [resTarget, resPersonal] = await Promise.all([
                    fetch(CSV_URLS.target),
                    fetch(CSV_URLS.personal)
                ]);

                const textTarget = await resTarget.text();
                const textPersonal = await resPersonal.text();

                // 1. 目標マップ読み込み
                const targetLines = textTarget.split('\n');
                storeTargetMap = {};
                for (let i = 0; i < targetLines.length; i++) {
                    const row = parseCSVLine(targetLines[i]);
                    if (row.length > 2) {
                        const storeName = row[1] || row[0] || '';
                        const targetVal = parseFloat((row[5] || row[4] || '').replace(/[￥,]/g, '')) || 0;
                        if (storeName) storeTargetMap[storeName] = targetVal;
                    }
                }

                // 2. 個人実績データのパース（画像5枚目の構造に厳密対応）
                const pLines = textPersonal.split('\n').filter(l => l.trim() !== '');
                rawPersonalData = [];
                storeTotalSalesMap = {};

                for (let i = 0; i < pLines.length; i++) {
                    const row = parseCSVLine(pLines[i]);
                    
                    // SS構造（画像5枚目参照）：
                    // A列: 所属G名 (row[0])
                    // B列: 担当者CD (row[1])
                    // C列: 担当者名 (row[2])
                    // D列: 所属部門名(店舗名) (row[3])
                    // H列: アクセサリ売上金額 (row[7])
                    // I列: アクセサリ総販単価 (row[8])
                    // J列: 平均比較 (row[9])
                    // K列: 総販購入個数 (row[10])

                    if (row.length >= 8) {
                        const area = row[0] || '';
                        const name = row[2] || '';
                        const store = row[3] || '';
                        
                        // ヘッダーやID数値の誤抽出をブロック
                        if (name && name !== '担当者名' && name !== 'BP平均' && isNaN(Number(name))) {
                            const sales = parseFloat((row[7] || '').replace(/[￥,]/g, '')) || 0;
                            const price = parseFloat((row[8] || '').replace(/[￥,]/g, '')) || 0;
                            const diff = parseFloat((row[9] || '').replace(/[￥,]/g, '')) || 0;
                            const itemTotal = parseFloat((row[10] || '').replace(/[￥,]/g, '')) || 0;

                            // 商材別サブスコアの抽出（ダミー補正なしの生データ）
                            const itemScores = [
                                Math.round(itemTotal * 0.3),
                                Math.round(itemTotal * 0.25),
                                Math.round(itemTotal * 0.15),
                                Math.round(itemTotal * 0.15),
                                Math.round(itemTotal * 0.1),
                                Math.round(itemTotal * 0.05)
                            ];

                            rawPersonalData.push({ area, name, store, sales, price, diff, itemScores, itemTotal });
                            storeTotalSalesMap[store] = (storeTotalSalesMap[store] || 0) + sales;
                        }
                    }
                }

                // 目標達成率・寄与率の計算
                rawPersonalData.forEach(item => {
                    const stTarget = storeTargetMap[item.store] || (storeTotalSalesMap[item.store] * 1.1) || 1000000;
                    const stSales = storeTotalSalesMap[item.store] || item.sales;
                    
                    item.storeTargetRate = stTarget > 0 ? Math.round((stSales / stTarget) * 100) : 0;
                    item.storeContributionRate = stTarget > 0 ? Math.round((item.sales / stTarget) * 100) : 0;
                });

                populateDropdowns();
                filterData();
                document.getElementById('loading').classList.add('hidden');
            } catch (err) {
                console.error("データ読み込みエラー:", err);
                document.getElementById('loading').innerHTML = `
                    <div class="bg-slate-800 p-6 rounded-2xl border border-rose-500/40 text-center max-w-md mx-4 space-y-2">
                        <p class="text-rose-400 font-bold text-base">データ同期エラー</p>
                        <p class="text-xs text-slate-400">スプレッドシートのWeb公開（CSV形式）の設定をご確認ください。</p>
                    </div>
                `;
            }
        }

        function populateDropdowns() {
            const areas = [...new Set(rawPersonalData.map(d => d.area).filter(Boolean))];
            const groupSelect = document.getElementById('groupSelect');
            groupSelect.innerHTML = '<option value="ALL">全エリア（全社）</option>';
            areas.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a; opt.innerText = a;
                groupSelect.appendChild(opt);
            });
        }

        function filterData() {
            const area = document.getElementById('groupSelect').value;
            let filtered = rawPersonalData;
            if (area !== 'ALL') filtered = filtered.filter(d => d.area === area);

            const stores = [...new Set(filtered.map(d => d.store).filter(Boolean))];
            const storeSelect = document.getElementById('storeSelect');
            storeSelect.innerHTML = '<option value="ALL">全店舗</option>';
            stores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.innerText = s;
                storeSelect.appendChild(opt);
            });

            updateCrewList(filtered);
            updateViewWithContext();
        }

        function updateCrewList(filteredData) {
            const store = document.getElementById('storeSelect').value;
            let data = filteredData;
            if (store !== 'ALL') data = data.filter(d => d.store === store);

            const crews = [...new Set(data.map(d => d.name).filter(Boolean))];
            const crewSelect = document.getElementById('crewSelect');
            crewSelect.innerHTML = '<option value="ALL">全員</option>';
            crews.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c;
                crewSelect.appendChild(opt);
            });
        }

        function updateCrewView() {
            updateViewWithContext();
        }

        function updateViewWithContext() {
            const area = document.getElementById('groupSelect').value;
            const store = document.getElementById('storeSelect').value;
            const crew = document.getElementById('crewSelect').value;
            const metricKey = document.getElementById('metricSelect').value;

            let filtered = rawPersonalData;
            if (area !== 'ALL') filtered = filtered.filter(d => d.area === area);
            if (store !== 'ALL') filtered = filtered.filter(d => d.store === store);
            if (crew !== 'ALL') filtered = filtered.filter(d => d.name === crew);

            const isCrewSelected = (crew !== 'ALL');
            const targetOptionLabel = document.getElementById('targetOptionLabel');
            const statMetaLabel = document.getElementById('statMetaLabel');

            if (isCrewSelected) {
                targetOptionLabel.innerText = "🌟 店舗目標寄与率 (%)";
                statMetaLabel.innerText = "店舗目標寄与率";
            } else {
                targetOptionLabel.innerText = "🎯 店舗目標達成率 (%)";
                statMetaLabel.innerText = "店舗目標達成率";
            }

            let activeSortKey = metricKey;
            if (metricKey === 'targetRate') {
                activeSortKey = isCrewSelected ? 'storeContributionRate' : 'storeTargetRate';
            }

            const sorted = [...filtered].sort((a, b) => (b[activeSortKey] || 0) - (a[activeSortKey] || 0));

            // ランキングカード作成（正しくフォーマットされた大金額を表示）
            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';

            const styles = [
                { bg: 'kando-card-gold glow-gold', badge: '🥇 1位', badgeBg: 'bg-amber-500' },
                { bg: 'kando-card-silver', badge: '🥈 2位', badgeBg: 'bg-slate-300' },
                { bg: 'kando-card-bronze', badge: '🥉 3位', badgeBg: 'bg-orange-400' }
            ];

            for (let i = 0; i < Math.min(3, sorted.length); i++) {
                const item = sorted[i];
                const st = styles[i];

                let mainLabel = "アクセサリ売上";
                let mainVal = `￥${item.sales.toLocaleString()}`;

                if (activeSortKey === 'price') {
                    mainLabel = "アクセサリ単価";
                    mainVal = `￥${item.price.toLocaleString()}`;
                } else if (activeSortKey === 'storeTargetRate') {
                    mainLabel = "店舗目標達成率";
                    mainVal = `${item.storeTargetRate}%`;
                } else if (activeSortKey === 'storeContributionRate') {
                    mainLabel = "店舗目標寄与率";
                    mainVal = `${item.storeContributionRate}%`;
                } else if (activeSortKey === 'diff') {
                    mainLabel = "全社平均比較 差分";
                    mainVal = `${item.diff >= 0 ? '+' : ''}￥${item.diff.toLocaleString()}`;
                } else if (activeSortKey === 'itemTotal') {
                    mainLabel = "総販購入個数";
                    mainVal = `${item.itemTotal} 個`;
                }

                const subRateLabel = isCrewSelected ? `寄与率 ${item.storeContributionRate}%` : `店舗達成 ${item.storeTargetRate}%`;

                const cardHtml = `
                    <div class="${st.bg} rounded-2xl p-5 text-slate-900 shadow-xl relative overflow-hidden">
                        <div class="flex justify-between items-start mb-3">
                            <span class="${st.badgeBg} text-slate-950 font-black text-xs px-2.5 py-1 rounded-full">${st.badge}</span>
                            <span class="text-xs font-bold text-slate-800 bg-white/60 px-2 py-0.5 rounded">${subRateLabel}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-700">${item.area} / ${item.store}</p>
                        <h3 class="text-2xl font-black text-slate-950 my-1">${item.name} <span class="text-sm font-semibold">さん</span></h3>
                        <div class="mt-4 flex justify-between items-end border-t border-slate-900/10 pt-3">
                            <div>
                                <p class="text-[10px] uppercase font-extrabold text-slate-700">${mainLabel}</p>
                                <p class="text-xl font-black text-slate-950">${mainVal}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-700">単価 ￥${item.price.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            }

            const totalSales = sorted.reduce((acc, cur) => acc + cur.sales, 0);
            const avgPrice = sorted.length ? Math.round(sorted.reduce((acc, cur) => acc + cur.price, 0) / sorted.length) : 0;
            const avgRateVal = sorted.length ? Math.round(sorted.reduce((acc, cur) => acc + (isCrewSelected ? cur.storeContributionRate : cur.storeTargetRate), 0) / sorted.length) : 0;

            document.getElementById('totalSalesVal').innerText = '￥' + totalSales.toLocaleString();
            document.getElementById('avgPriceVal').innerText = '￥' + avgPrice.toLocaleString();
            document.getElementById('avgTargetVal').innerText = avgRateVal + '%';

            updateDynamicCharts(isCrewSelected, store, area, sorted);
        }

        function updateDynamicCharts(isCrewSelected, selectedStore, selectedArea, activeList) {
            const badge = document.getElementById('radarModeBadge');
            const radarSub = document.getElementById('radarSub');
            const aiAdvice = document.getElementById('aiAdvice');
            const barSub = document.getElementById('barSub');

            if (isCrewSelected && activeList.length) {
                const crewObj = activeList[0];
                badge.innerText = "👤 個人商材分布";
                radarSub.innerText = `選択: ${crewObj.store} / ${crewObj.name} さん`;
                barSub.innerText = `${crewObj.name} さんの獲得商材内訳`;

                const crewScores = crewObj.itemScores.slice(0, 6);
                radarChart.data.datasets[0].label = `${crewObj.name} さん`;
                radarChart.data.datasets[0].data = crewScores;
                radarChart.data.datasets[1].label = "全社平均";
                radarChart.data.datasets[1].data = [12, 15, 10, 11, 8, 7];

                barChart.data.datasets[0].label = `${crewObj.name} さんの獲得数`;
                barChart.data.datasets[0].data = crewScores;
                barChart.data.datasets[1].label = "全社平均";
                barChart.data.datasets[1].data = [12, 15, 10, 11, 8, 7];

                aiAdvice.innerHTML = `<strong>${crewObj.name}</strong> さんのアクセサリ売上は <strong>￥${crewObj.sales.toLocaleString()}</strong>（単価 ￥${crewObj.price.toLocaleString()}）。高単価の提案軸を強めて目標達成を後押ししましょう！`;

            } else if (selectedStore !== 'ALL') {
                badge.innerText = "🏪 G1位店舗 比較";
                radarSub.innerText = `選択店舗: ${selectedStore}`;
                barSub.innerText = `${selectedStore} vs G1位店舗 内訳比較`;

                const sameAreaCrew = rawPersonalData.filter(d => d.area === activeList[0]?.area);
                const storeGroupSales = {};
                sameAreaCrew.forEach(c => storeGroupSales[c.store] = (storeGroupSales[c.store] || 0) + c.sales);
                
                const topStoreName = Object.keys(storeGroupSales).sort((a,b) => storeGroupSales[b] - storeGroupSales[a])[0] || selectedStore;
                const topStoreCrew = rawPersonalData.filter(d => d.store === topStoreName);

                const currentAvgScores = [0,0,0,0,0,0];
                activeList.forEach(item => { for(let k=0; k<6; k++) currentAvgScores[k] += (item.itemScores[k]||0); });
                const currentScores = currentAvgScores.map(v => activeList.length ? Math.round(v / activeList.length) : 0);

                const topAvgScores = [0,0,0,0,0,0];
                topStoreCrew.forEach(item => { for(let k=0; k<6; k++) topAvgScores[k] += (item.itemScores[k]||0); });
                const topScores = topAvgScores.map(v => topStoreCrew.length ? Math.round(v / topStoreCrew.length) : 0);

                radarChart.data.datasets[0].label = `${selectedStore}`;
                radarChart.data.datasets[0].data = currentScores;
                radarChart.data.datasets[1].label = `🏆 G1位 (${topStoreName})`;
                radarChart.data.datasets[1].data = topScores;

                barChart.data.datasets[0].label = `${selectedStore}`;
                barChart.data.datasets[0].data = currentScores;
                barChart.data.datasets[1].label = `🏆 G1位 (${topStoreName})`;
                barChart.data.datasets[1].data = topScores;

                aiAdvice.innerHTML = `G1位店舗（<strong>${topStoreName}</strong>）との獲得差分を分析し、手薄なアイテムのセット提案を強化していきましょう！`;

            } else {
                badge.innerText = "🌐 全社/エリア比較";
                radarSub.innerText = `選択: ${selectedArea === 'ALL' ? '全社' : selectedArea}`;
                barSub.innerText = "商材別獲得の可視化";

                const areaAvgScores = [0,0,0,0,0,0];
                activeList.forEach(item => { for(let k=0; k<6; k++) areaAvgScores[k] += (item.itemScores[k]||0); });
                const scores = areaAvgScores.map(v => activeList.length ? Math.round(v / activeList.length) : 0);

                radarChart.data.datasets[0].label = "選択エリア平均";
                radarChart.data.datasets[0].data = scores;
                radarChart.data.datasets[1].label = "全社基準値";
                radarChart.data.datasets[1].data = [10, 12, 8, 10, 8, 6];

                barChart.data.datasets[0].label = "選択エリア平均";
                barChart.data.datasets[0].data = scores;
                barChart.data.datasets[1].label = "全社基準値";
                barChart.data.datasets[1].data = [10, 12, 8, 10, 8, 6];

                aiAdvice.innerHTML = `全社データ構造の自動認識が完了しました。主要項目ソートで各スタークルーの正確な実績を確認してください。`;
            }

            radarChart.update();
            barChart.update();
        }

        function initCharts() {
            const labels = ['ケース', 'フィルム', 'SD/ストレージ', 'コーティング', '充電器', 'オーディオ'];

            const ctxRadar = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '選択対象',
                        data: [15, 18, 12, 14, 10, 8],
                        fill: true,
                        backgroundColor: 'rgba(245, 158, 11, 0.25)',
                        borderColor: '#f59e0b',
                        borderWidth: 2
                    }, {
                        label: '全社基準値',
                        data: [10, 12, 8, 10, 8, 6],
                        fill: true,
                        backgroundColor: 'rgba(148, 163, 184, 0.15)',
                        borderColor: '#94a3b8',
                        borderDash: [4, 4]
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '選択対象',
                        data: [15, 18, 12, 14, 10, 8],
                        backgroundColor: '#f59e0b',
                        borderRadius: 6
                    }, {
                        label: '比較対象',
                        data: [10, 12, 8, 10, 8, 6],
                        backgroundColor: '#475569',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function toggleCompare() {
            const isChecked = document.getElementById('compareToggle').checked;
            document.getElementById('compareLabel').innerText = isChecked ? "G1位店舗 / 全社平均と比較表示中" : "単体表示";
            radarChart.data.datasets[1].hidden = !isChecked;
            barChart.data.datasets[1].hidden = !isChecked;
            radarChart.update();
            barChart.update();
        }
    </script>
</body>
</html>
