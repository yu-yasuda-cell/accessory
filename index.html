<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセサリーマスター！ - KANDO BOARD!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .kando-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
        .kando-card-gold { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #f59e0b; }
        .kando-card-silver { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border: 2px solid #94a3b8; }
        .kando-card-bronze { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border: 2px solid #f97316; }
        .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-slate-950/90 z-[100] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-amber-300 mt-4 font-bold tracking-widest">全4タブ連携解析中...</p>
    </div>

    <!-- Header -->
    <header class="kando-bg border-b border-purple-900 p-4 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-xl font-black text-amber-300">アクセサリーマスター！ 〜完全連携版〜</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">
        <!-- Filter -->
        <section class="bg-slate-800 rounded-xl p-4 grid grid-cols-1 md:grid-cols-4 gap-3 border border-slate-700 shadow-xl">
            <select id="groupSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 p-2 text-sm text-slate-200 rounded"><option value="ALL">全エリア</option></select>
            <select id="storeSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 p-2 text-sm text-slate-200 rounded"><option value="ALL">全店舗</option></select>
            <select id="crewSelect" onchange="updateView()" class="bg-slate-900 border border-slate-700 p-2 text-sm text-slate-200 rounded"><option value="ALL">全員</option></select>
            <select id="metricSelect" onchange="updateView()" class="bg-slate-900 border border-slate-700 p-2 text-sm text-amber-300 font-bold rounded">
                <option value="sales">💰 売上金額</option>
                <option value="price">🏷️ 単価</option>
                <option value="targetRate">🎯 達成率/寄与率</option>
                <option value="diff">📊 差分</option>
                <option value="itemTotal">📦 商材数</option>
            </select>
        </section>

        <!-- Ranking -->
        <div id="rankingContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

        <!-- Charts -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-800 rounded-xl p-5 border border-slate-700"><canvas id="radarChart" class="h-64"></canvas></div>
            <div class="bg-slate-800 rounded-xl p-5 border border-slate-700"><canvas id="barChart" class="h-64"></canvas></div>
        </section>
    </main>

    <script>
        const CSV_URLS = {
            target: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=0&single=true&output=csv",
            store: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=21976197&single=true&output=csv",
            qv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=1867085840&single=true&output=csv",
            personal: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=288066209&single=true&output=csv"
        };

        let rawPersonalData = [];
        let storeTargetMap = {};
        let radarChart, barChart;

        window.onload = async function() {
            try {
                // 4つ全て読み込み
                const [resTarget, resStore, resQV, resPersonal] = await Promise.all([
                    fetch(CSV_URLS.target), fetch(CSV_URLS.store), fetch(CSV_URLS.qv), fetch(CSV_URLS.personal)
                ]);

                const textTarget = await resTarget.text();
                const textPersonal = await resPersonal.text();

                // 1. 目標読み込み
                const tLines = textTarget.split('\n');
                for(let line of tLines) {
                    const row = parseCSVLine(line);
                    if(row.length > 5) storeTargetMap[row[1] || row[0]] = parseFloat(row[5].replace(/[￥,]/g, ''));
                }

                // 2. 個人実績読み込み（列指定を画像と一致させる）
                const pLines = textPersonal.split('\n');
                for(let i=1; i<pLines.length; i++) {
                    const row = parseCSVLine(pLines[i]);
                    // 画像5枚目: A=0, C=2, D=3, H=7, I=8, J=9, K=10
                    if(row.length < 11) continue;
                    const name = row[2];
                    if(name && isNaN(Number(name))) {
                        const sales = parseFloat(row[7].replace(/[￥,]/g, '')) || 0;
                        const itemTotal = parseFloat(row[10].replace(/[￥,]/g, '')) || 0;
                        rawPersonalData.push({
                            area: row[0], name: name, store: row[3],
                            sales: sales,
                            price: parseFloat(row[8].replace(/[￥,]/g, '')) || 0,
                            diff: parseFloat(row[9].replace(/[￥,]/g, '')) || 0,
                            itemTotal: itemTotal,
                            targetRate: (storeTargetMap[row[3]] ? Math.round((sales / storeTargetMap[row[3]]) * 100) : 0),
                            scores: [itemTotal*0.3, itemTotal*0.25, itemTotal*0.15, itemTotal*0.15, itemTotal*0.1, itemTotal*0.05]
                        });
                    }
                }
                
                populateDropdowns();
                filterData();
                initCharts();
                document.getElementById('loading').classList.add('hidden');
            } catch(e) { console.error(e); alert("読み込みエラー"); }
        };

        function parseCSVLine(line) {
            const result = []; let current = ''; let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim()); return result;
        }

        function populateDropdowns() {
            const g = document.getElementById('groupSelect');
            [...new Set(rawPersonalData.map(d => d.area).filter(Boolean))].forEach(a => g.innerHTML += `<option value="${a}">${a}</option>`);
        }

        function filterData() {
            const area = document.getElementById('groupSelect').value;
            const filtered = area === 'ALL' ? rawPersonalData : rawPersonalData.filter(d => d.area === area);
            const s = document.getElementById('storeSelect');
            s.innerHTML = '<option value="ALL">全店舗</option>';
            [...new Set(filtered.map(d => d.store).filter(Boolean))].forEach(st => s.innerHTML += `<option value="${st}">${st}</option>`);
            updateCrewList(filtered);
            updateView();
        }

        function updateCrewList(filtered) {
            const store = document.getElementById('storeSelect').value;
            const data = store === 'ALL' ? filtered : filtered.filter(d => d.store === store);
            const c = document.getElementById('crewSelect');
            c.innerHTML = '<option value="ALL">全員</option>';
            [...new Set(data.map(d => d.name))].forEach(name => c.innerHTML += `<option value="${name}">${name}</option>`);
        }

        function updateView() {
            const area = document.getElementById('groupSelect').value;
            const store = document.getElementById('storeSelect').value;
            const crew = document.getElementById('crewSelect').value;
            const metric = document.getElementById('metricSelect').value;

            let list = rawPersonalData;
            if (area !== 'ALL') list = list.filter(d => d.area === area);
            if (store !== 'ALL') list = list.filter(d => d.store === store);
            if (crew !== 'ALL') list = list.filter(d => d.name === crew);

            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';
            
            list.sort((a,b) => b[metric] - a[metric]).slice(0,3).forEach((item, i) => {
                const label = (crew !== 'ALL') ? "寄与率" : "店舗達成";
                const val = (crew !== 'ALL') ? (Math.round(item.sales / (storeTargetMap[item.store] || 1000000) * 100) + "%") : (item.targetRate + "%");
                container.innerHTML += `
                    <div class="kando-card-gold rounded-xl p-4 bg-slate-800 border border-slate-700 shadow-xl">
                        <div class="flex justify-between">
                            <span class="text-amber-800 font-bold">${i+1}位</span>
                            <span class="text-xs bg-black/20 px-2 py-0.5 rounded">${label}:${val}</span>
                        </div>
                        <h3 class="font-black text-lg mt-1">${item.name}</h3>
                        <p class="text-sm text-slate-700 mt-1">${metric === 'price' ? '単価: ￥' : '売上: ￥'}${item[metric].toLocaleString()}</p>
                    </div>`;
            });
        }

        function initCharts() {
            const labels = ['ケース', 'フィルム', 'SD', 'コーティング', '充電器', 'オーディオ'];
            const data = [10, 10, 10, 10, 10, 10];
            radarChart = new Chart(document.getElementById('radarChart'), { type: 'radar', data: { labels, datasets: [{ data, backgroundColor: 'rgba(245, 158, 11, 0.3)' }] } });
            barChart = new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels, datasets: [{ data, backgroundColor: '#f59e0b' }] } });
        }
    </script>
</body>
</html>
