<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセサリーマスター！ - KANDO BOARD!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .kando-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
        .kando-card-gold { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #f59e0b; }
        .kando-card-silver { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border: 2px solid #94a3b8; }
        .kando-card-bronze { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border: 2px solid #f97316; }
        .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="loading" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center space-y-4">
        <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-amber-300 font-bold text-sm tracking-widest animate-pulse">データを安定読み込み中...</p>
    </div>

    <header class="kando-bg border-b border-purple-900/50 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-3"><h1 class="text-xl font-black text-amber-300">アクセサリーマスター！ 〜LIVE実績連携版〜</h1></div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <select id="groupSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全エリア</option></select>
                <select id="storeSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全店舗</option></select>
                <select id="crewSelect" onchange="updateView()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全員</option></select>
                <select id="metricSelect" onchange="updateView()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-300 font-bold"><option value="sales">アクセサリ売上</option><option value="price">総販単価</option></select>
            </div>
        </section>
        <div id="rankingContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?gid=288066209&single=true&output=csv";
        let rawPersonalData = [];

        window.onload = async function() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim() !== '');
                
                // 1行目からヘッダーを特定
                const headerRow = parseCSVLine(lines[0]);
                const h = {
                    area: headerRow.findIndex(c => c.includes('グループ')),
                    name: headerRow.findIndex(c => c.includes('担当者')),
                    store: headerRow.findIndex(c => c.includes('店舗名')),
                    sales: headerRow.findIndex(c => c.includes('売上')),
                    price: headerRow.findIndex(c => c.includes('単価'))
                };

                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    if (row[h.name]) {
                        rawPersonalData.push({
                            area: row[h.area] || "",
                            name: row[h.name] || "",
                            store: row[h.store] || "",
                            sales: parseFloat(row[h.sales].replace(/[￥,]/g, '')) || 0,
                            price: parseFloat(row[h.price].replace(/[￥,]/g, '')) || 0
                        });
                    }
                }
                
                populateDropdowns();
                filterData();
                document.getElementById('loading').classList.add('hidden');
            } catch(e) { console.error(e); alert("読み込みエラー"); }
        };

        function parseCSVLine(line) {
            const result = []; let current = ''; let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim()); return result;
        }

        function populateDropdowns() {
            const g = document.getElementById('groupSelect');
            const areas = [...new Set(rawPersonalData.map(d => d.area).filter(Boolean))];
            areas.forEach(a => g.innerHTML += `<option value="${a}">${a}</option>`);
        }

        function filterData() {
            const area = document.getElementById('groupSelect').value;
            const filtered = area === 'ALL' ? rawPersonalData : rawPersonalData.filter(d => d.area === area);
            
            const s = document.getElementById('storeSelect');
            s.innerHTML = '<option value="ALL">全店舗</option>';
            [...new Set(filtered.map(d => d.store).filter(Boolean))].forEach(st => s.innerHTML += `<option value="${st}">${st}</option>`);
            
            updateCrewList(filtered);
            updateView();
        }

        function updateCrewList(filtered) {
            const store = document.getElementById('storeSelect').value;
            const data = store === 'ALL' ? filtered : filtered.filter(d => d.store === store);
            const c = document.getElementById('crewSelect');
            c.innerHTML = '<option value="ALL">全員</option>';
            [...new Set(data.map(d => d.name).filter(Boolean))].forEach(name => c.innerHTML += `<option value="${name}">${name}</option>`);
        }

        function updateView() {
            const area = document.getElementById('groupSelect').value;
            const store = document.getElementById('storeSelect').value;
            const crew = document.getElementById('crewSelect').value;
            const metric = document.getElementById('metricSelect').value;

            let list = rawPersonalData;
            if (area !== 'ALL') list = list.filter(d => d.area === area);
            if (store !== 'ALL') list = list.filter(d => d.store === store);
            if (crew !== 'ALL') list = list.filter(d => d.name === crew);

            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';
            const sorted = list.sort((a,b) => b[metric] - a[metric]).slice(0,3);
            
            sorted.forEach((item, i) => {
                container.innerHTML += `
                    <div class="kando-card-gold rounded-2xl p-5 bg-slate-800 border border-slate-700">
                        <p class="text-amber-400 font-bold">${i+1}位</p>
                        <h3 class="text-xl font-black text-slate-900">${item.name}</h3>
                        <p class="text-sm text-slate-700">売上: ￥${item.sales.toLocaleString()}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
