<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセサリーマスター！ - KANDO BOARD!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .kando-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
        .kando-card-gold { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #f59e0b; }
        .kando-card-silver { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border: 2px solid #94a3b8; }
        .kando-card-bronze { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border: 2px solid #f97316; }
        .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="loading" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center space-y-4">
        <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-amber-300 font-bold text-sm tracking-widest animate-pulse">実績データ連動中...</p>
    </div>

    <!-- Header (省略) -->
    <header class="kando-bg border-b border-purple-900/50 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-3"><h1 class="text-xl font-black text-amber-300">アクセサリーマスター！ 〜LIVE実績連携版〜</h1></div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-slate-800/80 rounded-2xl p-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <select id="groupSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全エリア</option></select>
                <select id="storeSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全店舗</option></select>
                <select id="crewSelect" onchange="updateCrewView()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="ALL">全員</option></select>
                <select id="metricSelect" onchange="filterData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-300 font-bold"><option value="sales">アクセサリ売上</option><option value="price">総販単価</option></select>
            </div>
        </section>

        <div id="rankingContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmGVxoipW4IZFlXB9PZE1OAbclnDw-o_7d8jU2M8U6hIjo5JesdQWlDrgvf7zye1sHYxiXDWfcMuVT/pub?output=csv";
        let rawPersonalData = [];

        window.onload = async function() {
            try {
                const res = await fetch(CSV_URL);
                const csvText = await res.text();
                const lines = csvText.split('\n');
                
                // 5行目までヘッダーと仮定し、6行目から読み込み
                for (let i = 5; i < lines.length; i++) {
                    const cols = lines[i].split(',');
                    if (cols.length > 12 && cols[3]) {
                        rawPersonalData.push({
                            area: cols[1].trim(),
                            name: cols[3].trim(),
                            store: cols[5].trim(),
                            sales: Number(cols[11]) || 0,
                            price: Number(cols[12]) || 0
                        });
                    }
                }
                
                // プルダウン生成
                const areas = [...new Set(rawPersonalData.map(d => d.area).filter(Boolean))];
                const g = document.getElementById('groupSelect');
                areas.forEach(a => g.innerHTML += `<option value="${a}">${a}</option>`);
                
                document.getElementById('loading').classList.add('hidden');
                filterData();
            } catch(e) { alert("データ読み込み失敗"); }
        };

        function filterData() {
            const area = document.getElementById('groupSelect').value;
            let filtered = area === 'ALL' ? rawPersonalData : rawPersonalData.filter(d => d.area === area);
            
            const stores = [...new Set(filtered.map(d => d.store).filter(Boolean))];
            const s = document.getElementById('storeSelect');
            s.innerHTML = '<option value="ALL">全店舗</option>';
            stores.forEach(st => s.innerHTML += `<option value="${st}">${st}</option>`);
            
            updateView(filtered);
        }

        function updateView(list) {
            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';
            const sorted = list.sort((a,b) => b.sales - a.sales).slice(0,3);
            sorted.forEach((item, i) => {
                container.innerHTML += `
                    <div class="kando-card-gold rounded-2xl p-5 bg-slate-800 border border-slate-700">
                        <p class="text-amber-400 font-bold">${i+1}位</p>
                        <h3 class="text-xl font-black">${item.name}</h3>
                        <p class="text-sm">売上: ￥${item.sales.toLocaleString()}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
